name: Package

# Builds native, unsigned PyInstaller bundles for macOS (both Apple Silicon
# and Intel - PyInstaller doesn't produce universal2 binaries, and PySide6
# isn't shipped as universal2 either, so the two need separate runners),
# Windows, and Linux, and attaches them as downloadable workflow artifacts.
#
# Deliberately does NOT trigger on `pull_request`: only pushes to `main`
# (i.e. after a PR has been reviewed and merged by a maintainer) or a
# manual run trigger a build. Combined with branch protection on `main`
# (Settings → Branches → require a pull request + approval before
# merging), this means only the repo owner/maintainers can cause a build
# to run - contributor PRs only ever go through the `CI` workflow (lint +
# tests), never this one.
#
# No code signing/notarization yet (see the Roadmap in README.md) - these
# are plain unsigned builds; expect Gatekeeper/SmartScreen warnings on
# first launch, per packaging/README.md.

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "packaging/**"
      - "pyproject.toml"
      - ".github/workflows/package.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # macos-latest = Apple Silicon (arm64). macos-15-intel is GitHub's
        # last Intel (x86_64) macOS image, available until Aug 2027 - see
        # https://github.com/actions/runner-images - without it, an
        # Apple-Silicon-only build can't even launch on an Intel Mac
        # ("isn't supported by this Mac", not just a Gatekeeper warning).
        os: [macos-latest, macos-15-intel, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install Qt runtime dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon0 libgl1

      - name: Install the app + build tooling
        run: pip install -e ".[dev]"

      - name: Build with PyInstaller
        run: pyinstaller packaging/pyinstaller/myapps.spec --noconfirm

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          # runner.arch is needed too: both macOS runners report
          # runner.os == 'macOS', and upload-artifact requires unique
          # names within a run.
          name: MyAppsLibrary-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          path: dist/
          retention-days: 30
          if-no-files-found: error
