name: Release

# Builds native, unsigned PyInstaller bundles for macOS (Apple Silicon and
# Intel - see the `os` matrix below), Windows, and Linux, and publishes
# them as downloadable assets on a GitHub Release - this is
# what end users should actually download the app from (see the
# Installation section in README.md), as opposed to `package.yml`, which
# just validates on every push to main that the build still works (its
# artifacts expire after 30 days and aren't meant for public download).
#
# Two ways to trigger a release:
#   1. Push a version tag:
#        git tag v0.6.0 && git push origin v0.6.0
#      (tags aren't covered by the `main` branch ruleset, so this doesn't
#      need a PR - only someone with push access can do it).
#   2. Manually, from the Actions tab → this workflow → "Run workflow",
#      giving the tag to use. Handy for re-publishing release assets
#      without cutting a new tag (e.g. after fixing a build issue), or for
#      creating the very first release off of `main` directly.
#
# Shares its build steps with `package.yml` - if you change how the app is
# built (spec file, dependencies, data files), update both.
#
# No code signing/notarization yet (see the Roadmap in README.md) - these
# are plain unsigned builds; expect Gatekeeper/SmartScreen warnings on
# first launch, per packaging/README.md.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to release (e.g. v0.6.0) - created at the current commit if it doesn't already exist"
        required: true

permissions:
  contents: write # needed to create the Release and upload assets
  pull-requests: write # needed to open the Homebrew cask bump PR below

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # macos-latest = Apple Silicon (arm64). macos-15-intel is GitHub's
        # last Intel (x86_64) macOS image, available until Aug 2027 - see
        # https://github.com/actions/runner-images - without it, an
        # Apple-Silicon-only build can't even launch on an Intel Mac
        # ("isn't supported by this Mac", not just a Gatekeeper warning).
        os: [macos-latest, macos-15-intel, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install Qt runtime dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon0 libgl1

      - name: Install the app + build tooling
        run: pip install -e ".[dev]"

      - name: Build with PyInstaller
        run: pyinstaller packaging/pyinstaller/myapps.spec --noconfirm

      - name: Zip the build for this OS
        shell: bash
        run: |
          mkdir -p release-assets
          case "${{ runner.os }}" in
            macOS)
              # `zip`/`upload-artifact` don't preserve the extended
              # attributes the .app's ad-hoc code signature relies on -
              # round-tripping through them turns the app "damaged" in
              # Finder/Gatekeeper (a barred/prohibitory icon on launch).
              # `ditto` is Apple's own tool for archiving .app bundles
              # losslessly and is what notarization workflows use.
              (cd dist && ditto -c -k --keepParent "MyAppsLibrary.app" "../release-assets/MyAppsLibrary-macOS-${{ runner.arch }}.zip")
              ;;
            Windows) (cd dist && 7z a "../release-assets/MyAppsLibrary-Windows.zip" "MyAppsLibrary") ;;
            Linux)   (cd dist && zip -r "../release-assets/MyAppsLibrary-Linux.zip" "MyAppsLibrary") ;;
          esac

      - name: Upload build as workflow artifact
        uses: actions/upload-artifact@v7
        with:
          # runner.arch is needed too: both macOS runners report
          # runner.os == 'macOS', and upload-artifact requires unique
          # names within a run.
          name: release-assets-${{ runner.os }}-${{ runner.arch }}
          path: release-assets/*.zip
          retention-days: 7
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Determine tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: release-assets-*
          path: release-assets
          merge-multiple: true

      - name: Create/update the GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: MyAppsLibrary ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          files: release-assets/*.zip

  update-homebrew-tap:
    name: Update Homebrew cask
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Compute checksums for the new macOS release assets
        id: sha
        env:
          TAG: ${{ needs.release.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          arm_url="https://github.com/${REPO}/releases/download/${TAG}/MyAppsLibrary-macOS-ARM64.zip"
          intel_url="https://github.com/${REPO}/releases/download/${TAG}/MyAppsLibrary-macOS-X64.zip"
          arm_sha=$(curl -fsSL "$arm_url" | sha256sum | cut -d' ' -f1)
          intel_sha=$(curl -fsSL "$intel_url" | sha256sum | cut -d' ' -f1)
          echo "arm_sha=$arm_sha" >> "$GITHUB_OUTPUT"
          echo "intel_sha=$intel_sha" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Update Casks/my-apps-library.rb in this repo
        run: |
          python3 packaging/homebrew/bump_cask.py \
            --version "${{ steps.sha.outputs.version }}" \
            --arm-sha256 "${{ steps.sha.outputs.arm_sha }}" \
            --intel-sha256 "${{ steps.sha.outputs.intel_sha }}"

      # `main` is branch-protected (PR required, no bypass available to
      # the default GITHUB_TOKEN - a plain `git push origin HEAD:main`
      # here was tried and always rejected with GH013, even with a
      # "Deploy keys" bypass entry, since the token authenticates as the
      # GitHub Actions app, not a deploy key). Opening a PR instead needs
      # no bypass at all and matches how every other change lands on
      # this repo - merge it from the Actions run summary or the Pull
      # requests tab once it's up.
      - name: Open a PR with the cask bump
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "Bump Homebrew cask to ${{ needs.release.outputs.tag }}"
          title: "Bump Homebrew cask to ${{ needs.release.outputs.tag }}"
          body: |
            Automated cask bump for the ${{ needs.release.outputs.tag }} release.

            - `version` → ${{ steps.sha.outputs.version }}
            - macOS ARM64 sha256 → `${{ steps.sha.outputs.arm_sha }}`
            - macOS Intel sha256 → `${{ steps.sha.outputs.intel_sha }}`

            Merge this to keep `brew upgrade --cask my-apps-library` pointed at the new release.
          branch: chore/cask-${{ needs.release.outputs.tag }}
          delete-branch: true
          add-paths: Casks/my-apps-library.rb

      # The tap (rodolphe37/homebrew-my-apps-library) is a separate repo -
      # the default GITHUB_TOKEN above only has write access to *this*
      # repo, so pushing there needs a fine-grained PAT scoped to just
      # that repo (Contents: read and write), stored as the
      # HOMEBREW_TAP_TOKEN secret. See packaging/homebrew/README.md for
      # how to create one - until it's set, this step skips itself with a
      # warning instead of failing the whole release.
      - name: Push the updated cask to the Homebrew tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::warning::HOMEBREW_TAP_TOKEN secret not set - skipping the tap push. See packaging/homebrew/README.md."
            exit 0
          fi
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/rodolphe37/homebrew-my-apps-library.git" tap-repo
          cp Casks/my-apps-library.rb tap-repo/Casks/my-apps-library.rb
          cd tap-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/my-apps-library.rb
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Bump to ${{ needs.release.outputs.tag }}"
            git push
          fi
