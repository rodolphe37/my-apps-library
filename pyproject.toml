[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "myapps"
version = "0.13.0"
description = "MyAppsLibrary - a personal launcher/library for your developer projects"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "PolyForm-Noncommercial-1.0.0" }
authors = [{ name = "Rodolphe Augusto" }]
dependencies = [
    "PySide6>=6.6",
    "platformdirs>=4.0",
    "darkdetect>=0.8",
]

[project.optional-dependencies]
dev = [
    "pyinstaller>=6.0",
    "pytest>=8.0",
    "pytest-qt>=4.4",
    "ruff>=0.6",
    "Pillow>=10.0",  # regenerating packaging/icons/* from new source artwork
]

[project.scripts]
myapps = "myapps.app:main"

# Reserved for Phase 2 plugin discovery via importlib.metadata.entry_points(group="myapps.plugins")
[project.entry-points."myapps.plugins"]

[tool.hatch.build.targets.wheel]
packages = ["src/myapps"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
